<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Murmur (プロトタイプ)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <main id="view" class="view"></main>

  <div id="post-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="post-modal-title">投稿する</h2>
        <button type="button" class="icon-button" id="post-modal-close" aria-label="閉じる">✕</button>
      </div>
      <form id="post-form">
        <textarea id="post-content" maxlength="280" placeholder="いまどうしてる?" rows="4"></textarea>
        <div class="post-form-meta">
          <span id="post-char-count">0 / 280</span>
        </div>
        <div id="post-image-previews" class="image-previews"></div>
        <div class="post-form-actions">
          <label class="file-input-label">
            画像を追加(最大4枚)
            <input type="file" id="post-image-input" accept="image/*" multiple hidden />
          </label>
          <button type="submit" class="primary-button" id="post-submit-button">投稿する</button>
        </div>
      </form>
    </div>
  </div>

  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>プロフィールを編集</h2>
        <button type="button" class="icon-button" id="profile-modal-close" aria-label="閉じる">✕</button>
      </div>
      <form id="profile-form">
        <div class="profile-form-avatar">
          <div id="profile-avatar-preview"></div>
          <label class="file-input-label">
            アイコン画像を変更
            <input type="file" id="profile-avatar-input" accept="image/*" hidden />
          </label>
        </div>
        <label>表示名
          <input type="text" id="profile-display-name" required maxlength="50" />
        </label>
        <label>自己紹介
          <textarea id="profile-bio" maxlength="160" rows="3"></textarea>
        </label>
        <div class="post-form-actions">
          <span></span>
          <button type="submit" class="primary-button">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <div id="confirm-dialog" class="modal-overlay hidden">
    <div class="modal modal-small">
      <p id="confirm-dialog-message">本当に削除しますか?</p>
      <div class="confirm-dialog-actions">
        <button type="button" class="secondary-button" id="confirm-dialog-cancel">キャンセル</button>
        <button type="button" class="danger-button" id="confirm-dialog-ok">削除する</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
