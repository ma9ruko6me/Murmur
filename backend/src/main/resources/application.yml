spring:
  application:
    name: murmur
  profiles:
    active: dev

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/murmur
    username: murmur
    password: murmur
  flyway:
    locations: classpath:db/migration

jwt:
  secret: dev-only-secret-key-please-change-me-32bytes-min
  expiration-ms: 900000

refresh-token:
  expiration-ms: 1209600000

cookie:
  secure: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000

refresh-token:
  expiration-ms: 1209600000

cookie:
  secure: true
